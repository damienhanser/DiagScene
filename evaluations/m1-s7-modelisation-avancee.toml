# Évaluation « M1 S7 – Modélisation 3D avancée » (ENSA Nancy, 2026-2027, scénario A')
# Fichier externe, fourni par l'enseignant : DiagScene > menu des thématiques > « Charger un fichier .toml… ».
# Il n'est pas livré avec l'extension. Ne pas le modifier : son empreinte figure dans le journal et dans
# chaque rapport, et elle est comparée à celle du fichier officiel.
#
# Brief : faire coexister des matériaux PBR et une représentation non réaliste dans une même image.
# Condition de rendu : zéro alerte bloquante.
# Seules les règles écrites ici sont actives (seulement_listees = true).
# Seuils de poids à calibrer sur un fichier de référence.

[meta]
nom = "M1 S7 – Modélisation 3D avancée"
version = "2026-11-23"
ordre = 0
description = "Évaluation M1 S7 : rendu mixte PBR et non réaliste, fichier sain et léger"
seulement_listees = true

# --- Bloquant : le fichier ne peut pas être rendu ------------------------
[regles.camera_active]
niveau = "bloquant"

[regles.cameras_nommees]           # image mixte et image de variante
niveau = "bloquant"
minimum = 2

[regles.textures_manquantes]
niveau = "bloquant"

[regles.uv_manquantes]             # seulement là où une texture image est placée par des UV
niveau = "bloquant"
seulement_textures_image = true

[regles.uv_ecrasees]
niveau = "bloquant"
seulement_textures_image = true

[regles.lampe_noyee]
niveau = "bloquant"

[regles.journal_travail]           # DiagScene doit être installé et actif pendant tout le travail
niveau = "avertissement"           # trop peu de jours ou d'enregistrements
niveau_absent = "bloquant"         # pas de journal, ou journal désactivé
niveau_altere = "avertissement"    # chaîne rompue : examiné à l'oral
min_jours = 2
min_enregistrements = 5

# --- Avertissement : pèse sur la note (C1, C2) --------------------------
[regles.echelle_non_appliquee]
niveau = "avertissement"
niveau_si_sensible = "avertissement"

[regles.echelle_negative]
niveau = "avertissement"

[regles.camera_aplomb]
niveau = "avertissement"

[regles.camera_focale]
niveau = "avertissement"

[regles.espace_couleur]
niveau = "avertissement"

[regles.puissance]
niveau = "avertissement"

[regles.rendu_non_realiste]        # « acquis » quand un mode non réaliste est présent
niveau_si_absent = "avertissement"

[regles.texture_surdimensionnee]   # C1 : poids maîtrisé
niveau = "avertissement"
facteur_max = 4.0
taille_min = 2048

[regles.densite_polygones]
niveau = "avertissement"
faces_par_px = 2.0
faces_min = 20000
total_max = 3000000

[regles.geometrie]                 # normales inversées, sommets en double, faces non planes
niveau = "avertissement"

[regles.poids_fichier]             # information : poids, faces, mémoire des textures

# --- Conseil : fait la différence entre « acquis » et « maîtrisé » ------
[regles.noms_par_defaut]
niveau = "conseil"

[regles.objets_racine]
niveau = "conseil"

[regles.materiau_absent]
niveau = "conseil"

[regles.nodes_non_relies]
niveau = "conseil"

[regles.uv_etirement]
niveau = "conseil"

[regles.uv_densite]
niveau = "conseil"

[regles.copies_non_liees]
niveau = "conseil"

[regles.donnees_inutilisees]
niveau = "conseil"
